---
- name: Deploy Simple Website
  hosts: webservers
  become: true
  gather_facts: true

  tasks:
    - name: Create website directory
      ansible.builtin.file:
        path: /var/www/html
        state: directory
        mode: '0755'

    - name: Deploy website homepage
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Ansible Infrastructure Automation</title>
          </head>
          <body>
              <h1>Welcome to Ansible Infrastructure Automation</h1>
              <h2>Server: {{ inventory_hostname }}</h2>
              <p>Managed automatically using Ansible.</p>
          </body>
          </html>
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Ensure Nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
